<style>
:root{--bg:#08060C;--panel:#120D1A;--ink:#EEE8F4;--muted:#9388A1;--line:#241A32;--line-fuerte:#46365A;--accent:#8E44D6;--accent-2:#A35CE8;--accent-ink:#FFFFFF;--accent-txt:#B98AF5;--tinte:#1A1226;--ok:#23DBDB;--warn:#F2B55F;--bad:#FF6B6B;--campo:#08060C;
  --fd:'Josefin Sans','Futura','Century Gothic',sans-serif;--fd-peso:300;--fb:'Mulish','Helvetica Neue',system-ui,sans-serif;--r:3px;--r-btn:3px;--r-campo:3px;--r-hoja:6px;--btn-caja:uppercase;--btn-tracking:.1em;
  --foto-bg:radial-gradient(90% 80% at 60% 30%,#3A1A55,#08060C 75%);--m1:#8E44D6;--m2:#23DBDB;--m3:#E7739D;--em-estilo:normal;--em-color:#23DBDB}
/* ===== base compartida: componentes de la aplicación (cada tema define las variables) ===== */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;padding-top:42px;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);font-weight:var(--fd-peso,400);line-height:1.08;margin:0;text-wrap:balance}
p{margin:0}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,textarea{font:inherit;color:var(--ink);background:var(--campo,transparent);border:1px solid var(--line);border-radius:var(--r-campo,10px);padding:12px 14px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 0}label input,label textarea{margin-top:6px}
em{font-style:var(--em-estilo,italic);color:var(--em-color,inherit)}

#demo{position:fixed;inset:0 0 auto 0;height:42px;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:#111;color:#cfcfcf;font:500 12px/1 system-ui,sans-serif;letter-spacing:.02em}
#demo b{background:#f4c14f;color:#111;padding:3px 7px;border-radius:4px;margin-right:8px;letter-spacing:.08em}
#demo div{display:flex;gap:4px;align-items:center}
#demo a,#demo button{color:#cfcfcf;text-decoration:none;padding:7px 11px;border-radius:6px;font:inherit}
#demo a.on{background:#fff;color:#111}#demo button{opacity:.7;border:1px solid #444;margin-left:6px}
@media(max-width:720px){#demo span{display:none}#demo{justify-content:center;padding:0 8px}#demo a,#demo button{padding:7px 9px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:var(--r-btn,999px);font-weight:600;font-size:14px;letter-spacing:var(--btn-tracking,.02em);text-transform:var(--btn-caja,none);transition:transform .15s,background .2s,color .2s;white-space:nowrap}
.btn svg{width:18px;height:18px}.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:var(--accent-ink)}.btn-p:hover{background:var(--accent-2,var(--accent))}
.btn-s{border:1px solid var(--line-fuerte,var(--line));color:var(--ink)}.btn-s:hover{border-color:var(--accent);color:var(--accent-txt,var(--accent))}
.btn.ancho{width:100%;margin-top:12px}.btn.chico{padding:8px 14px;font-size:12.5px}.btn:disabled{opacity:.6;cursor:wait}
.enlace{display:inline-block;margin-top:14px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}.enlace:hover{color:var(--accent-txt,var(--accent))}
.nota{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}.vacio{color:var(--muted);font-size:14px;padding:14px 0}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:120;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:12px;font-size:14px;max-width:min(92vw,460px);text-align:center;transition:.3s;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* hoja modal: reserva y cajones del panel */
.velo{position:fixed;inset:0;background:rgba(10,8,8,.55);backdrop-filter:blur(3px);z-index:100;animation:ap .2s}
.hoja{position:fixed;z-index:101;background:var(--panel);color:var(--ink);left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:min(88vh,760px);border-radius:var(--r-hoja,22px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid var(--line);animation:sube .28s cubic-bezier(.2,.8,.2,1)}
@keyframes ap{from{opacity:0}}@keyframes sube{from{opacity:0;transform:translate(-50%,-46%)}}
@media(max-width:640px){.hoja{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:92vh;border-radius:var(--r-hoja,22px) var(--r-hoja,22px) 0 0;animation:sube-m .3s cubic-bezier(.2,.8,.2,1)}@keyframes sube-m{from{transform:translateY(60px);opacity:0}}}
.hoja-cab{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:14px 16px 6px}
.hoja-cab button{width:36px;height:36px;border-radius:50%;font-size:20px;display:grid;place-items:center;color:var(--muted)}.hoja-cab button:hover{background:var(--line)}
.migas{display:flex;gap:6px;justify-content:center}.migas i{width:26px;height:3px;border-radius:2px;background:var(--line)}.migas i.ok{background:var(--muted)}.migas i.on{background:var(--accent)}
.eleccion{font-size:12.5px;color:var(--muted);text-align:center;padding:0 20px}
.hoja-cuerpo{padding:12px 24px 26px;overflow:auto}.hoja-cuerpo h3{font-size:26px;margin:6px 0 14px}
.grupo{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.opciones{display:grid;gap:8px}
.op{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-campo,12px);transition:.15s}
.op:hover{border-color:var(--accent);background:var(--tinte)}.op b{font-weight:600}.op small{grid-column:1;color:var(--muted);font-size:12.5px}.op span{grid-row:1/3;grid-column:2;align-self:center;font-weight:600}
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 54px;padding:9px 0;border:1px solid var(--line);border-radius:14px;text-align:center}.dia small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.dia b{font-size:19px;font-weight:600}
.dia.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.dia.on small{color:inherit;opacity:.8}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.hora{padding:11px 0;text-align:center;border:1px solid var(--line);border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums}.hora:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.reloj{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:12px;background:var(--tinte);border:1px dashed var(--accent);font-size:13.5px}.reloj b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent-txt,var(--accent))}
.resumen{margin:14px 0 4px;border-top:1px solid var(--line)}.resumen div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.resumen span{color:var(--muted)}.resumen b{font-weight:600;text-align:right}.resumen .tot b{color:var(--accent-txt,var(--accent));font-size:17px}
.medios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.medio{padding:11px 4px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:13px;font-weight:600}.medio.on{border-color:var(--accent);background:var(--tinte)}
.listo{text-align:center;padding:10px 0}.listo p{margin-top:8px}.check{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:30px;background:var(--ok);color:#fff}.check.mal{background:var(--bad)}

/* bot de WhatsApp: mantiene los colores de WhatsApp en todos los temas */
.fab-wsp{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;border-radius:999px;padding:13px 18px 13px 14px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}.fab-wsp svg{width:24px;height:24px}
#chat{position:fixed;right:18px;bottom:18px;z-index:95;width:min(380px,calc(100vw - 24px));height:min(620px,calc(100vh - 80px));display:none;flex-direction:column;border-radius:20px;overflow:hidden;background:#efe7dd;color:#111;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.45)}
#chat.on{display:flex;animation:ap .2s}
@media(max-width:640px){#chat{right:0;bottom:0;width:100vw;height:calc(100vh - 42px);border-radius:0}}
.chat-cab{display:flex;align-items:center;gap:10px;background:#075e54;color:#fff;padding:12px 14px}.chat-cab b{display:block;font-size:15px}.chat-cab small{font-size:12px;opacity:.85}.chat-cab button{margin-left:auto;font-size:24px;color:#fff;width:36px;height:36px}
.avatar{width:38px;height:38px;border-radius:50%;background:#dcf8c6;color:#075e54;display:grid;place-items:center;font-weight:700}
.chat-cuerpo{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.chat-aviso{align-self:center;background:#fdf4c5;color:#5c5430;font-size:11.5px;text-align:center;padding:6px 10px;border-radius:8px;margin-bottom:6px;max-width:90%}
.burbuja{max-width:84%;padding:8px 10px 5px;border-radius:10px;font-size:14px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.12);color:#111}
.burbuja.bot{background:#fff;align-self:flex-start;border-top-left-radius:2px}.burbuja.yo{background:#dcf8c6;align-self:flex-end;border-top-right-radius:2px}
.burbuja time{display:block;text-align:right;font-size:10.5px;color:#7a8a80;margin-top:2px}
.puntos{display:flex;gap:4px;padding:12px}.puntos i{width:7px;height:7px;border-radius:50%;background:#9aa;animation:bot 1s infinite}.puntos i:nth-child(2){animation-delay:.15s}.puntos i:nth-child(3){animation-delay:.3s}@keyframes bot{50%{transform:translateY(-4px);opacity:.5}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}.chips button{background:#fff;color:#027eb5;border:1px solid #cfe3ec;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}.chips button:hover{background:#e8f4fa}
.pago-link{display:block;width:100%;margin-top:8px;background:#075e54;color:#fff;padding:11px;border-radius:8px;text-align:center;font-weight:600;font-size:14px}.pago-link small{display:block;font-weight:400;font-size:11px;opacity:.8}
.pago-ok{margin-top:8px;background:#e7f7ec;color:#1a7a3e;padding:9px;border-radius:8px;text-align:center;font-weight:600;font-size:13px}
.chat-pie{display:flex;gap:8px;padding:10px;background:#f0f0f0}.chat-pie input{background:#fff;border:0;border-radius:999px;color:#111;padding:11px 16px}.chat-pie button{flex:0 0 44px;height:44px;border-radius:50%;background:#075e54;color:#fff;font-size:16px;text-align:center}
.vista-wsp{background:#efe7dd;border-radius:14px;padding:14px;margin-top:12px;display:flex}

/* panel del salón */
.admin{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 42px)}
.lado{position:sticky;top:42px;height:calc(100vh - 42px);padding:26px 16px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.lado .logo{font-family:var(--fd);font-size:24px;text-decoration:none;padding:0 10px 22px;line-height:1.1}.lado .logo small{display:block;font-family:var(--fb);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.lado nav{display:grid;gap:2px}.lado nav a{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14.5px;color:var(--muted)}
.lado nav a:hover{color:var(--ink)}.lado nav a.on{background:var(--tinte);color:var(--ink);font-weight:600}
.lado nav i{font-style:normal;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px}
.autor{font-size:11.5px;color:var(--muted);margin-top:auto}.autor a{text-underline-offset:3px}.autor.movil{display:none;margin-top:30px;text-align:center}
.principal{padding:30px clamp(16px,3.5vw,44px) 60px;min-width:0;max-width:1240px}
.cab h1{font-size:clamp(30px,4vw,42px);margin-bottom:22px}
.intro{color:var(--muted);font-size:14.5px;max-width:70ch;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r,16px);padding:18px}.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{display:block;font-family:var(--fd);font-weight:var(--fd-peso,400);font-size:34px;line-height:1.15;margin:6px 0 2px}.kpi small{font-size:12px;color:var(--muted)}
.kpi.alerta{border-color:var(--warn)}.kpi.alerta b{color:var(--warn)}
.caja{background:var(--panel);border:1px solid var(--line);border-radius:var(--r,16px);padding:20px;margin-bottom:14px}
.caja h3{font-family:var(--fb);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between}.caja h3 small{font-weight:500;letter-spacing:0;text-transform:none}.caja h3.sub{margin-top:22px}
.caja.destaca{border-color:var(--accent)}
.dos{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.barra{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}.barra .dias{padding-bottom:2px}.buscar{max-width:360px}.cuenta{color:var(--muted);font-size:13px}
.columnas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.cita{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:start;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);border-left:3px solid var(--ok);margin-bottom:8px;transition:.15s;background:var(--bg)}
.cita:hover{border-color:var(--accent);border-left-color:var(--accent)}.est-b-pendiente{border-left-color:var(--warn)}.est-b-atendida{border-left-color:var(--muted);opacity:.75}.est-b-noasistio{border-left-color:var(--bad);opacity:.7}
.ch{font-weight:700;font-variant-numeric:tabular-nums}.ch small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cc b{display:block;font-size:14.5px}.cc small{display:block;color:var(--muted);font-size:12.5px;margin-bottom:5px}
.col .cita{grid-template-columns:46px 1fr}.col .co{display:none}
.est{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.est-pendiente{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.est-atendida{background:var(--tinte);color:var(--muted)}.est-noasistio,.est-liberada{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.co{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}.o-whatsapp{color:#1faa59;border-color:#1faa5966}
.fila{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}.fila:last-child{border-bottom:0}a.fila:hover{background:var(--tinte)}
.tabla .fila:not(.seg){grid-template-columns:40px 1fr auto}.tabla div.fila{grid-template-columns:1fr auto auto}
.inicial{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--tinte);color:var(--accent-txt,var(--accent));font-family:var(--fd);font-size:18px;text-decoration:none}.inicial.grande{width:64px;height:64px;font-size:28px}
.fn b{display:block;font-size:14.5px}.fn b a{text-decoration:none}.fn small{color:var(--muted);font-size:12.5px}.fn u{text-decoration-color:var(--accent);text-underline-offset:3px;color:var(--ink)}
.ft em{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap}.ft .mal{color:var(--bad);font-weight:700}.ft .ojo{color:var(--warn);font-weight:700}.ft .ok{color:var(--ok)}
.enviado{font-size:12px;color:var(--ok);font-weight:600;white-space:nowrap}.monto{font-variant-numeric:tabular-nums}
.ficha-cab{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 20px}.ficha-cab h2{font-size:32px}.ficha-cab p{color:var(--muted)}
.ficha-n{display:flex;gap:26px;margin-left:auto}.ficha-n b{display:block;font-family:var(--fd);font-weight:var(--fd-peso,400);font-size:24px}.ficha-n span{font-size:12px;color:var(--muted)}
.volver{margin:0 0 10px}
.toca{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.toca:last-child{border:0}.toca b{font-size:17px}.toca small{display:block;color:var(--muted);font-size:12.5px}
.hist{list-style:none;margin:0;padding:0}.hist li{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:0 0 18px;position:relative}
.hist li::before{content:"";position:absolute;left:100px;top:8px;bottom:-6px;width:1px;background:var(--line)}.hist li:last-child::before{display:none}
.hist time{font-size:12px;color:var(--muted);padding-top:3px}.hist div{padding-left:22px;position:relative}.hist div::before{content:"";position:absolute;left:-3.5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.hist b{display:block;font-size:14.5px}.hist small{color:var(--muted);font-size:12.5px}.hist p{font-size:13px;margin-top:4px;padding:8px 10px;background:var(--tinte);border-radius:8px}
.tp{display:grid;grid-template-columns:1.8fr 1fr .8fr .9fr .8fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.tp:last-child{border:0}
.tp.cab{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.tp small{display:block;color:var(--muted);font-size:12px}.tp label{margin:0}.tp label i{display:none}.tp input{padding:9px 10px;margin:0}.tp .ab{font-weight:600;font-variant-numeric:tabular-nums}
.interruptor{display:flex;gap:14px;align-items:flex-start;margin:0;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer}.interruptor:last-child{border:0}
.interruptor input{position:absolute;opacity:0;width:0}.interruptor span{flex:0 0 44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:.2s;margin-top:2px}
.interruptor span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.interruptor input:checked+span{background:var(--ok)}.interruptor input:checked+span::after{left:21px}.interruptor input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.interruptor b{display:block;font-size:14.5px}.interruptor small{color:var(--muted);font-size:13px}

    if (t < minAhora) continue;
    if (!ocup.some(([a,b]) => t < b && t + min > a)) out.push(aHora(t));

/* ---------- arte: mechas de pelo en SVG (reemplazables por fotos reales en /img) ---------- */
function mechas(seed, n = 30) {
  let r = seed * 9301 + 49297; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  let p = '';
  for (let i = 0; i < n; i++) {
    const x = 40 + rnd()*320, a = (rnd()-.5)*260, b = (rnd()-.5)*300, c = (rnd()-.3)*240;
    p += `<path class="m${1 + (i%3)}" d="M${x.toFixed(0)},-20 C${(x+a).toFixed(0)},140 ${(x-b).toFixed(0)},300 ${(x+c).toFixed(0)},540" stroke-width="${(0.6 + rnd()*2.6).toFixed(1)}" opacity="${(0.25 + rnd()*0.7).toFixed(2)}"/>`;
  }
  return `<svg class="mechas" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke-linecap="round">${p}</svg>`;
}

let R = null;

function cerrarReserva() { if (R && R.citaId) { const c = S.citas.find(x => x.id === R.citaId); if (c && c.estado === 'pendiente') { liberar(c.id); toast('No se pagó el abono: la hora quedó libre otra vez.'); } } R = null; $('#modal').innerHTML = ''; pintar(); }

  if (R.paso === 3) { const dias = proximosDias(12); if (!R.fecha) R.fecha = dias.find(d => libresServ(R.servId, R.proId, d).length) || dias[0]; const hs = libresServ(R.servId, R.proId, R.fecha);
    cuerpo = `<h3>Elige día y hora</h3><div class="dias">${dias.map(d => `<button class="dia ${d === R.fecha ? 'on':''}" data-act="r-dia" data-id="${d}"><small>${deIso(d).toLocaleDateString('es-CL',{weekday:'short'}).replace('.','')}</small><b>${deIso(d).getDate()}</b></button>`).join('')}</div>

  if (R.paso === 4) cuerpo = `<h3>${R.admin ? 'Datos de la clienta' : '¿A nombre de quién?'}</h3><label>Nombre y apellido<input id="r-nombre" value="${esc(R.nombre)}" placeholder="Ej: María Pérez" autocomplete="off"></label><label>WhatsApp<input id="r-tel" value="${esc(R.tel)}" placeholder="+56 9 ..." inputmode="tel" autocomplete="off"></label>

}
const AccR = {
  'r-serv': d => { R.servId = d.id; R.proId = unicaPro(d.id); R.fecha = null; R.paso = R.proId ? 3 : 2; }, 'r-pro': d => { R.proId = d.id; R.fecha = null; R.paso = 3; }, 'r-dia': d => { R.fecha = d.id; },
  'r-hora': d => { R.hora = d.id; R.proFinal = d.pro; R.paso = 4; }, 'r-atras': () => { R.paso = (R.paso === 3 && unicaPro(R.servId)) ? 1 : R.paso - 1; }, 'r-medio': d => { R.medio = d.id; },
  'r-datos': () => { R.nombre = $('#r-nombre').value.trim(); R.tel = $('#r-tel').value.trim(); if (R.nombre.length < 3) { toast('Escribe el nombre para dejar la hora a tu nombre.'); return; }
    if (!libresServ(R.servId, R.proFinal, R.fecha).some(x => x.hora === R.hora)) { toast('Esa hora se acaba de ocupar. Elige otra.'); R.paso = 3; return; }
    R.citaId = tomarHora({ nombre:R.nombre, tel:R.tel, servId:R.servId, proId:R.proFinal, fecha:R.fecha, hora:R.hora, origen: R.admin ? 'salon' : 'web' }).id; R.paso = 5; },

/* ---------- bot de WhatsApp (simulado) ---------- */
let C = null;
function abrirChat() { if (!C) { C = { estado:'menu', msgs:[], d:{} }; $('#chat').classList.add('on'); pintarChat(); botDice(`¡Hola! 👋 Soy la asistente virtual de <b>${SALON.nombre}</b>. Respondo al tiro, a cualquier hora. ¿Qué necesitas?`, menuChips()); } else { $('#chat').classList.toggle('on'); } }
const menuChips = () => [['Agendar una hora','agendar'],['Ver precios','precios'],['Horario y dirección','info'],['Hablar con una persona','persona']];
function botDice(html, chips, extra) { C.escribiendo = true; pintarChat(); setTimeout(() => { C.escribiendo = false; C.msgs.push({ de:'bot', html, chips: chips || [], extra }); pintarChat(); }, 650 + Math.random()*500); }
function yoDigo(t) { C.msgs.forEach(m => m.chips = []); C.msgs.push({ de:'yo', html: esc(t), chips: [] }); pintarChat(); }
function pintarChat() {
  const hora = new Date().toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' });
  $('#chat').innerHTML = `<div class="chat-cab"><div class="avatar">${esc(SALON.nombre[0])}</div><div><b>${esc(SALON.nombre)}</b><small>${C.escribiendo ? 'escribiendo…' : 'en línea · responde automático'}</small></div><button data-act="chat" aria-label="Cerrar chat">×</button></div>
    <div class="chat-cuerpo" id="chat-cuerpo"><p class="chat-aviso">Simulación de WhatsApp. En el sistema real, esta conversación ocurre en el WhatsApp del salón.</p>${C.msgs.map(m => `<div class="burbuja ${m.de}"><div>${m.html}</div>${m.extra || ''}<time>${hora}${m.de === 'yo' ? ' ✓✓' : ''}</time></div>${m.chips.length ? `<div class="chips">${m.chips.map(([t,v]) => `<button data-act="chip" data-v="${esc(v)}" data-t="${esc(t)}">${t}</button>`).join('')}</div>` : ''}`).join('')}${C.escribiendo ? '<div class="burbuja bot puntos"><i></i><i></i><i></i></div>' : ''}</div>
    <form class="chat-pie" data-form="chat"><input id="chat-in" placeholder="${C.estado === 'nombre' ? 'Escribe tu nombre y apellido' : 'Escribe un mensaje'}" autocomplete="off"><button aria-label="Enviar">➤</button></form>`;
  const c = $('#chat-cuerpo'); c.scrollTop = c.scrollHeight;
}
function botRecibe(v, texto) {
  yoDigo(texto); const d = C.d;
  if (C.estado === 'nombre' && !v) { d.nombre = texto.trim(); const cita = tomarHora({ nombre:d.nombre, tel:'+56 9 (este chat)', servId:d.servId, proId:d.proId, fecha:d.fecha, hora:d.hora, origen:'whatsapp' }); d.citaId = cita.id; C.estado = 'pago'; const s = serv(d.servId);
    return botDice(`Gracias, ${esc(d.nombre.split(' ')[0])}. Te estoy guardando la hora por <b>${SALON.minutosReserva} minutos</b>:<br><br>💇 ${esc(s.nombre)}<br>👩 ${pro(d.proId).nombre}<br>📅 ${fDiaLargo(d.fecha)}, ${d.hora}<br>💰 Total ${clp(s.precio)}<br><br>Para dejarla tomada falta el abono de <b>${clp(cita.abono)}</b>. Sin abono, la hora se libera sola.`, [['Ahora no','nopago']], `<button class="pago-link" data-act="chat-pagar">🔒 Pagar abono ${clp(cita.abono)}<small>enlace de pago seguro · simulado</small></button>`); }
  if (!v) { const t = texto.toLowerCase(); v = /precio|valor|cu[aá]nto|sale/.test(t) ? 'precios' : /hora|agend|reserv|cita|quiero/.test(t) ? 'agendar' : /direcci|d[oó]nde|horario|abren|ubic/.test(t) ? 'info' : /persona|humano|alguien|grace/.test(t) ? 'persona' : 'nose'; }
  if (v === 'menu') { C.estado = 'menu'; return botDice('¿En qué más te ayudo?', menuChips()); }
  if (v === 'precios') return botDice(Object.entries(CATS).map(([k,n]) => `<b>${n}</b><br>${S.servicios.filter(s => s.cat === k).map(s => `${esc(s.nombre)}: ${clp(s.precio)}`).join('<br>')}`).join('<br><br>') + `<br><br>Todas las horas se reservan con un abono del ${SALON.abonoPct}%.`, [['Agendar una hora','agendar'],['Volver al menú','menu']]);
  if (v === 'info') return botDice(`📍 ${SALON.direccion}<br>🕙 ${SALON.horario}<br>Domingo cerrado.`, [['Agendar una hora','agendar'],['Volver al menú','menu']]);
  if (v === 'persona') return botDice('Le aviso a Grace para que te escriba apenas se desocupe. Mientras tanto, igual puedo agendarte yo. 😊', [['Agendar una hora','agendar'],['Volver al menú','menu']]);
  if (v === 'nose') return botDice('No estoy segura de haber entendido. Puedo ayudarte con esto:', menuChips());
  if (v === 'agendar') { C.estado = 'cat'; C.d = {}; return botDice('¡Feliz! ¿Qué te quieres hacer?', Object.entries(CATS).map(([k,n]) => [n, 'cat:'+k])); }
  if (v.startsWith('cat:')) { C.estado = 'serv'; return botDice('¿Cuál de estos?', S.servicios.filter(s => s.cat === v.slice(4)).map(s => [`${esc(s.nombre)} · ${clp(s.precio)}`, 'serv:'+s.id])); }
  if (v.startsWith('serv:') && unicaPro(v.slice(5))) { d.servId = v.slice(5); const u = pro(unicaPro(d.servId)); C.msgs.push({ de:'bot', html:`${esc(serv(d.servId).nombre)} dura ${dur(serv(d.servId).min)} y lo hace ${u.nombre}.`, chips:[] }); v = 'pro:' + u.id; }
  if (v.startsWith('serv:')) { d.servId = v.slice(5); C.estado = 'pro'; return botDice(`${esc(serv(d.servId).nombre)} dura ${dur(serv(d.servId).min)}. ¿Con quién prefieres atenderte?`, [['La primera disponible','pro:cualquiera'], ...prosDe(d.servId).map(p => [p.nombre, 'pro:'+p.id])]); }
  if (v.startsWith('pro:')) { d.proPref = v.slice(4); C.estado = 'dia'; const dias = proximosDias(8).filter(x => libresServ(d.servId, d.proPref, x).length).slice(0,5); return botDice('Estos días tengo horas:', dias.map(x => [fDia(x), 'dia:'+x])); }
  if (v.startsWith('dia:')) { d.fecha = v.slice(4); C.estado = 'hora'; const hs = libresServ(d.servId, d.proPref, d.fecha); const paso = Math.max(1, Math.floor(hs.length/6)); return botDice(`Para el ${fDiaLargo(d.fecha)} me quedan:`, [...hs.filter((_,i) => i % paso === 0).slice(0,6).map(x => [x.hora, `hora:${x.hora}:${x.proId}`]), ['Otro día','pro:'+d.proPref]]); }
  if (v.startsWith('hora:')) { const p = v.split(':'); d.hora = p[1]+':'+p[2]; d.proId = p[3]; C.estado = 'nombre'; return botDice('Perfecto. ¿A nombre de quién dejo la hora? Escríbeme tu nombre y apellido.'); }
  if (v === 'nopago') { C.estado = 'menu'; return botDice(`Ningún problema. Te guardo la hora ${SALON.minutosReserva} minutos por si te animas. Pasado ese tiempo se libera sola y le queda disponible a otra clienta.`, [['Volver al menú','menu']]); }
}

let G = { abierta:true, paso:0 };
try { const g = JSON.parse(localStorage.getItem(CLAVE + '-guia')); if (g) G = g; } catch(e) {}
function pintarGuia() { try { localStorage.setItem(CLAVE + '-guia', JSON.stringify(G)); } catch(e) {}
  const p = GUIA[G.paso], n = GUIA.length;
  $('#guia').innerHTML = G.abierta ? `<div class="guia-c" role="region" aria-label="Recorrido guiado"><div class="guia-cab"><span>Recorrido guiado · ${G.paso + 1} de ${n}</span><button data-act="g-min" aria-label="Minimizar el recorrido">–</button></div><div class="guia-barra"><i style="width:${(G.paso + 1) / n * 100}%"></i></div>
    <b>${p.t}</b><p>${p.d}</p><button class="btn btn-p ancho" data-act="g-ir">${p.b}</button><div class="guia-nav"><button data-act="g-ant" ${G.paso === 0 ? 'disabled' : ''}>← Anterior</button><button data-act="g-sig" ${G.paso === n - 1 ? 'disabled' : ''}>Siguiente →</button></div></div>`
    : `<button class="guia-pildora" data-act="g-min">Recorrido guiado · ${G.paso + 1}/${n}</button>`; }

/* ---------- pintar, reloj y eventos ---------- */
function pintar() { const admin = ruta()[0] === 'admin'; document.body.dataset.vista = admin ? 'admin' : 'sitio';
  $('#demo').innerHTML = `<span><b>DEMO</b> ${TEMA.nombre} · datos ficticios</span><div><a href="#/sitio" class="${admin ? '' : 'on'}">Lo que ve la clienta</a><a href="#/admin/hoy" class="${admin ? 'on' : ''}">Lo que ve el salón</a><button data-act="reiniciar" title="Borra lo que hiciste y vuelve a los datos iniciales">Reiniciar</button></div>`;
  const foco = document.activeElement && document.activeElement.id === 'a-q';
  $('#app').innerHTML = admin ? vistaAdmin() : vistaSitio();
  if (admin) { $('#cajon').innerHTML = A.cita ? cajonCita() : A.rec ? cajonRec() : A.plan ? cajonPlan() : ''; if (foco) { const q = $('#a-q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } } else { $('#cajon').innerHTML = ''; cargarFotos(); if (TEMA.alPintar) TEMA.alPintar(); }
}
function tic() { let cambio = false; S.citas.forEach(c => { if (c.estado === 'pendiente' && c.expira <= Date.now()) { c.estado = 'liberada'; cambio = true; if (R && R.citaId === c.id) { R.paso = 7; R.citaId = null; pintarReserva(); } } });
  if (cambio) { guardar(); if (ruta()[0] === 'admin') pintar(); }
  document.querySelectorAll('[data-reloj]').forEach(el => { const c = S.citas.find(x => x.id === el.dataset.reloj); if (c && c.expira) el.textContent = restante(c); });
  if (R && R.paso === 5) { const c = S.citas.find(x => x.id === R.citaId), el = $('#r-reloj'); if (c && el) el.textContent = restante(c); } }
document.addEventListener('click', e => { const sc = e.target.closest('[data-scroll]'); if (sc) { e.preventDefault(); const o = $(sc.getAttribute('href')); if (o) o.scrollIntoView({ behavior:'smooth' }); return; }
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, d = el.dataset;
  if (AccR[a]) { if (AccR[a](d, el) !== 'no' && R) pintarReserva(); return; }
  if (a === 'g-min') { G.abierta = !G.abierta; return pintarGuia(); } if (a === 'g-sig' || a === 'g-ant') { G.paso = Math.max(0, Math.min(GUIA.length - 1, G.paso + (a === 'g-sig' ? 1 : -1))); return pintarGuia(); }
  if (a === 'g-ir') { if (window.innerWidth < 700) G.abierta = false; GUIA[G.paso].ir(); return pintarGuia(); }
  if (a === 'reservar') return abrirReserva(d.serv); if (a === 'chat') return abrirChat(); if (a === 'chip') return botRecibe(d.v, d.t); if (a === 'chat-pagar') return chatPagar(el);
  if (a === 'reiniciar') { try { localStorage.removeItem(CLAVE); } catch(e) {} S = semilla(); C = null; R = null; G = { abierta:true, paso:0 }; pintarGuia(); A = { dia:null, q:'', cita:null, rec:null, plan:null }; $('#chat').classList.remove('on'); $('#chat').innerHTML = ''; $('#modal').innerHTML = ''; pintar(); return toast('Demo reiniciada con los datos iniciales.'); }
  if (a === 'a-dia') { A.dia = d.id; return pintar(); } if (a === 'a-nueva') return abrirReserva(null, true); if (a === 'a-cita') { A.cita = d.id; A.rec = null; return pintar(); }
  if (a === 'a-cerrar' || a === 'a-cerrar-ir') { A.cita = null; A.rec = null; A.plan = null; return pintar(); }
  if (a === 'a-rec') { A.rec = leToca(d.c).find(x => x.servId === d.s); A.cita = null; return pintar(); }
  if (a === 'a-rec-plan') { const p = S.planes.find(x => x.id === d.id), e = estadoPlan(p); A.rec = { clientaId:p.clientaId, servId:p.servId, plan:p, n:e.n }; A.cita = null; return pintar(); }
  if (a === 'a-plan-nuevo') { A.plan = d.c; return pintar(); }
  if (a === 'a-plan-guardar') { const s = $('#pl-serv').value, total = Math.max(2, parseInt($('#pl-total').value, 10) || 4), cada = Math.max(1, parseInt($('#pl-cada').value, 10) || 4); S.planes.push({ id: uid('pl'), clientaId:A.plan, nombre: $('#pl-nombre').value.trim() || 'Plan de ' + minus(serv(s).nombre), servId:s, total, cada, inicio:hoy() }); guardar(); A.plan = null; pintar(); return toast('Plan creado. El sistema llevará la cuenta de las sesiones.'); }
  if (a === 'a-enviar') { clienta(A.rec.clientaId).recordado = hoy(); guardar(); toast(`Aviso enviado a ${esc(clienta(A.rec.clientaId).nombre)} (simulado).`); A.rec = null; return pintar(); }
  const c = S.citas.find(x => x.id === A.cita); if (!c) return;
  if (a === 'a-atender') { c.estado = 'atendida'; c.nota = $('#a-nota').value.trim(); guardar(); const s = serv(c.servId); A.cita = null; pintar(); const pl = S.planes.find(p => p.clientaId === c.clientaId && p.servId === c.servId && c.fecha >= p.inicio); if (pl) { const e = estadoPlan(pl); return toast(e.completo ? `Atención guardada. <b>${esc(pl.nombre)}</b> completo: ${pl.total} de ${pl.total} sesiones.` : `Atención guardada. Va en la sesión <b>${e.n} de ${pl.total}</b> de su ${esc(minus(pl.nombre))}. La siguiente toca el ${fDia(e.fecha)}.`); } return toast(s.ciclo ? `Atención guardada en su historial. Próxima sesión: <b>${esc(serv(s.sigue || s.id).nombre)}</b>, el ${fDia(masDias(c.fecha, s.ciclo*7))}.` : 'Atención guardada en su historial.'); }
  if (a === 'a-noasistio') { c.estado = 'noasistio'; guardar(); A.cita = null; return pintar(); }
  if (a === 'a-abono') { pagarAbono(c.id, 'Registrado por el salón'); A.cita = null; pintar(); return toast('Abono registrado: la hora quedó confirmada.'); }
  if (a === 'a-liberar') { liberar(c.id); A.cita = null; pintar(); return toast('Hora liberada: volvió a quedar disponible.'); }
});
document.addEventListener('submit', e => { if (e.target.dataset.form === 'chat') { e.preventDefault(); const i = $('#chat-in'), t = i.value.trim(); if (t) botRecibe(null, t); } });
document.addEventListener('input', e => { const el = e.target;
  if (el.id === 'a-q') { A.q = el.value; pintar(); } if (el.id === 'a-notas') { clienta(el.dataset.c).notas = el.value; guardar(); }
  if (el.dataset.campo) { const s = serv(el.dataset.id), v = parseInt(el.value, 10); s[el.dataset.campo] = el.dataset.campo === 'ciclo' ? (v > 0 ? v : null) : (v > 0 ? v : s[el.dataset.campo]); guardar(); const ab = document.querySelector(`[data-ab="${s.id}"]`); if (ab) ab.textContent = clp(abonoDe(s)); }
  if (el.dataset.bot) { S.bot[el.dataset.bot] = el.checked; guardar(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (R) AccR['r-cerrar'](); else if (A.cita || A.rec) { A.cita = null; A.rec = null; A.plan = null; pintar(); } } });
window.addEventListener('hashchange', () => { A.cita = null; A.rec = null; A.plan = null; pintar(); if (!location.hash.includes('/clientas/')) window.scrollTo(0,0); });
cargar(); pintar(); pintarGuia(); setInterval(tic, 1000);

</script></body></html>
